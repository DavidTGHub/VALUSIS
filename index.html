<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VALUSIS · Payment Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface2: #1a1a1a;
    --border: #2a2a2a; --border2: #333; --text: #e0e0e0;
    --muted: #888; --dim: #555; --white: #fff;
    --green: #22c55e; --gold: #f59e0b; --discord: #7b8aff;
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; }

  /* HEADER */
  .header { padding: 20px 28px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }
  .header-label { font-size: 9px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; margin-bottom: 4px; }
  .header-title { font-family: 'Syne', sans-serif; font-size: 20px; color: var(--white); letter-spacing: -0.5px; }
  .cycle-total-label { font-size: 9px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2px; text-align: right; }
  .cycle-total-value { font-size: 22px; font-weight: 700; color: #333; transition: color 0.2s; text-align: right; }
  .cycle-total-value.active { color: var(--white); }

  /* MAIN */
  .main { padding: 24px 28px; max-width: 700px; margin: 0 auto; }

  /* ENTRIES */
  .entry { border-bottom: 1px solid var(--border); }
  .entry-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; cursor: pointer; user-select: none; }
  .entry-left { display: flex; align-items: center; gap: 12px; }
  .entry-num { font-size: 10px; color: var(--dim); min-width: 22px; }
  .entry-name { font-size: 13px; color: #f0f0f0; font-weight: 500; }
  .entry-meta { font-size: 10px; color: var(--dim); margin-top: 3px; }
  .entry-right { display: flex; align-items: center; gap: 14px; text-align: right; }
  .entry-total { font-size: 16px; font-weight: 700; color: var(--white); }
  .entry-bonus-badge { font-size: 10px; color: var(--gold); margin-top: 1px; }
  .entry-tag { font-size: 9px; padding: 2px 7px; border-radius: 3px; letter-spacing: 1px; display: inline-block; margin-top: 3px; }
  .entry-tag.discord { background: #1e2050; color: var(--discord); border: 1px solid #3a3f7a; }
  .entry-tag.standard { background: #1e1e1e; color: #666; border: 1px solid #2a2a2a; }
  .entry-chevron { font-size: 10px; color: var(--dim); margin-left: 4px; }
  .entry-body { display: none; padding-bottom: 18px; }
  .entry-body.open { display: block; }
  .breakdown-text { background: #0f0f0f; border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; font-size: 12px; line-height: 1.9; color: #aaa; white-space: pre-wrap; margin-bottom: 10px; }
  .entry-actions { display: flex; gap: 8px; }
  .btn-copy, .btn-remove { font-family: 'DM Mono', monospace; font-size: 10px; padding: 6px 14px; border-radius: 5px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
  .btn-copy { background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); }
  .btn-copy:hover { color: #ccc; }
  .btn-copy.copied { background: #0d1f0d; border-color: #22c55e55; color: var(--green); }
  .btn-remove { background: transparent; border: 1px solid #3a1a1a; color: #854040; }
  .btn-remove:hover { color: #c05050; }
  .btn-edit { background: transparent; border: 1px solid #2a3a2a; color: #508050; font-family: 'DM Mono', monospace; font-size: 10px; padding: 6px 14px; border-radius: 5px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
  .btn-edit:hover { color: #80c080; }

  /* EMPTY */
  .empty { border: 1px dashed #252525; border-radius: 10px; padding: 44px 24px; text-align: center; margin-bottom: 16px; }
  .empty-label { font-size: 10px; color: #444; letter-spacing: 3px; text-transform: uppercase; }

  /* CREATE BUTTON */
  .btn-create { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: #888; font-family: 'DM Mono', monospace; font-size: 10px; padding: 13px; cursor: pointer; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 12px; transition: all 0.15s; }
  .btn-create:hover { background: #1a1a1a; border-color: #3a3a3a; color: #bbb; }

  /* FORM */
  .form { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .form-title { font-size: 9px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; }
  .field-label { font-size: 9px; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; display: block; }
  .field-group { margin-bottom: 14px; }
  input[type="text"], input[type="number"] { background: #111; border: 1px solid #2a2a2a; border-radius: 6px; color: #e0e0e0; font-family: 'DM Mono', monospace; font-size: 12px; padding: 8px 11px; width: 100%; outline: none; transition: border-color 0.15s; }
  input::placeholder { color: #333; }
  input:focus { border-color: #444; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
  .section-div { font-size: 9px; color: #555; letter-spacing: 2px; text-transform: uppercase; padding: 10px 0 8px; border-top: 1px solid #1e1e1e; margin: 6px 0 12px; }

  /* RATE TYPE */
  .rate-type-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .rate-type-btn { font-family: 'DM Mono', monospace; font-size: 10px; padding: 7px 14px; border-radius: 6px; cursor: pointer; letter-spacing: 0.5px; border: 1px solid #2a2a2a; background: #111; color: #666; transition: all 0.15s; }
  .rate-type-btn.active-std { background: var(--white); color: #000; border-color: var(--white); }
  .rate-type-btn.active-disc { background: #1e2050; color: var(--discord); border-color: var(--discord); }

  /* RATE PRESETS */
  .rate-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .rate-btn { font-family: 'DM Mono', monospace; background: #111; border: 1px solid #2a2a2a; border-radius: 5px; color: #666; font-size: 10px; padding: 6px 12px; cursor: pointer; transition: all 0.15s; }
  .rate-btn:hover { color: #999; border-color: #3a3a3a; }
  .rate-btn.active { background: var(--white); color: #000; border-color: var(--white); }
  .discord-note { font-size: 10px; color: #7b8affaa; background: #10122a; border: 1px solid #2a2e5a; border-radius: 6px; padding: 10px 12px; margin-top: 4px; line-height: 1.7; }
  .custom-rate { display: none; background: #0f0f0f; border-radius: 8px; padding: 12px; margin-top: 8px; border: 1px solid #1e1e1e; }
  .custom-rate.open { display: block; }

  /* VIEW CAP inline hint */
  .cap-hint { font-size: 10px; color: #555; margin-top: 6px; }

  /* BONUS SECTION */
  .bonus-section { background: #111; border: 1px solid #252525; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .bonus-section-title { font-size: 9px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .bonus-row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 10px; }
  .bonus-row:last-child { margin-bottom: 0; }
  .btn-add-bonus { font-family: 'DM Mono', monospace; background: transparent; border: 1px dashed #2a2a2a; border-radius: 5px; color: #444; font-size: 10px; padding: 7px; width: 100%; cursor: pointer; letter-spacing: 1px; transition: all 0.15s; margin-top: 8px; }
  .btn-add-bonus:hover { color: #888; border-color: #3a3a3a; }
  .btn-remove-bonus { background: transparent; border: none; color: #4a2020; font-size: 12px; cursor: pointer; padding: 0 4px; transition: color 0.15s; font-family: monospace; }
  .btn-remove-bonus:hover { color: #c05050; }

  /* PREVIEW */
  .preview-box { background: #0f0f0f; border: 1px solid #222; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .preview-label { font-size: 9px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .preview-text { font-size: 11px; color: #888; line-height: 1.9; white-space: pre-wrap; }

  /* TOTAL BAR */
  .total-bar { display: flex; justify-content: space-between; align-items: center; background: #0f0f0f; border: 1px solid #252525; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
  .total-bar-label { font-size: 9px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; }
  .total-bar-value { font-size: 20px; font-weight: 700; color: var(--white); }

  /* FORM ACTIONS */
  .form-actions { display: flex; gap: 8px; }
  .btn-add { flex: 1; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 7px; color: #555; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; padding: 12px; cursor: default; letter-spacing: 2px; text-transform: uppercase; transition: all 0.15s; }
  .btn-add.ready { background: var(--white); color: #000; cursor: pointer; border-color: var(--white); }
  .btn-cancel { background: transparent; border: 1px solid var(--border); border-radius: 7px; color: #666; font-family: 'DM Mono', monospace; font-size: 10px; padding: 12px 18px; cursor: pointer; transition: all 0.15s; }
  .btn-cancel:hover { color: #999; border-color: #3a3a3a; }

  /* SUMMARY */
  .summary { border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; justify-content: space-between; align-items: center; margin-top: 4px; display: none; }
  .eligible-row { display: flex; align-items: center; gap: 7px; margin-top: 7px; cursor: pointer; user-select: none; padding: 6px 10px; border-radius: 6px; border: 1px solid #222; background: #0f0f0f; transition: all 0.15s; }
  .eligible-row:hover { border-color: #333; background: #141414; }
  .eligible-row.checked { border-color: #22c55e44; background: #0d1f0d; }
  .eligible-row span { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: #444; transition: color 0.15s; }
  .eligible-row.checked span { color: #22c55e; }
  .eligible-check { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #2a2a2a; background: #111; display: flex; align-items: center; justify-content: center; font-size: 9px; color: transparent; transition: all 0.15s; flex-shrink: 0; }
  .eligible-check.checked { background: #22c55e; border-color: #22c55e; color: #000; font-weight: 700; }
  .summary-label { font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; }
  .summary-value { font-size: 16px; font-weight: 700; color: var(--white); }
  /* SHEETS */
  .sheets-bar { display: flex; align-items: center; gap: 6px; padding: 10px 16px 0; flex-wrap: wrap; border-bottom: 1px solid #1a1a1a; margin-bottom: 0; }
  .sheet-tab { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; padding: 6px 14px; border-radius: 6px 6px 0 0; cursor: pointer; border: 1px solid #222; border-bottom: none; color: #555; background: #0d0d0d; transition: all 0.15s; white-space: nowrap; position: relative; }
  .sheet-tab:hover { color: #aaa; }
  .sheet-tab.active { background: #161616; color: #fff; border-color: #333; }
  .sheet-tab .del-sheet { display: none; margin-left: 6px; color: #444; font-size: 10px; cursor: pointer; }
  .sheet-tab:hover .del-sheet { display: inline; }
  .sheet-tab .del-sheet:hover { color: #c05050; }
  .btn-new-sheet { font-family: 'DM Mono', monospace; font-size: 10px; color: #444; background: transparent; border: 1px dashed #252525; border-radius: 6px; padding: 5px 12px; cursor: pointer; letter-spacing: 1px; transition: all 0.15s; }
  .btn-new-sheet:hover { color: #888; border-color: #444; }
  .sheet-rename-input { font-family: 'DM Mono', monospace; font-size: 10px; background: transparent; border: none; border-bottom: 1px solid #555; color: #fff; outline: none; width: 100px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-label">VALUSIS · PAYMENTS</div>
    <div class="header-title">Influencer Pay</div>
  </div>
  <div>
    <div class="cycle-total-label">Cycle Total</div>
    <div class="cycle-total-value" id="cycleTotal">$0</div>
  </div>
</div>

<div class="sheets-bar" id="sheetsBar"></div>

<div class="main">
  <div id="entryList"></div>
  <div class="empty" id="emptyState"><div class="empty-label">No payments yet</div></div>
  <button class="btn-create" id="btnCreate">+ Create a Payment</button>
  <div id="formWrapper"></div>
  <div class="summary" id="summary">
    <div class="summary-label" id="summaryLabel"></div>
    <div class="summary-value" id="summaryValue"></div>
  </div>
</div>

<script>
  const SHEETS_KEY  = 'valusis_sheets';   // { id: {name, entries} }
  const ACTIVE_KEY  = 'valusis_active';   // active sheet id

  // Use localStorage, fall back to sessionStorage (works in iframes)
  function storage() {
    try { localStorage.setItem('__ping__','1'); localStorage.removeItem('__ping__'); return localStorage; }
    catch(e) { return sessionStorage; }
  }
  function loadSheets() {
    try { return JSON.parse(storage().getItem(SHEETS_KEY)) || {}; } catch(e) { return {}; }
  }
  function saveSheets() {
    try {
      storage().setItem(SHEETS_KEY, JSON.stringify(sheets));
      storage().setItem(ACTIVE_KEY, activeSheetId);
      const ind = document.getElementById('saveIndicator');
      if (ind) { ind.style.opacity = '1'; setTimeout(() => ind.style.opacity = '0', 1500); }
    } catch(e) { console.warn('Storage unavailable:', e); }
  }

  let sheets = loadSheets();
  // Migrate old single-sheet data
  const _old = storage().getItem('valusis_entries');
  if (_old && Object.keys(sheets).length === 0) {
    const _id = 'sheet_' + Date.now();
    sheets[_id] = { name: 'April 2026', entries: JSON.parse(_old) };
    storage().removeItem('valusis_entries');
    saveSheets();
  }
  // Ensure at least one sheet
  if (Object.keys(sheets).length === 0) {
    const _id = 'sheet_' + Date.now();
    sheets[_id] = { name: 'April 2026', entries: [] };
    saveSheets();
  }

  let activeSheetId = storage().getItem(ACTIVE_KEY) || Object.keys(sheets)[0];
  if (!sheets[activeSheetId]) activeSheetId = Object.keys(sheets)[0];

  function getEntries() { return sheets[activeSheetId]?.entries || []; }
  function setEntries(e) { if (sheets[activeSheetId]) sheets[activeSheetId].entries = e; }

  let entries = getEntries();

  function saveEntries() {
    setEntries(entries);
    saveSheets();
  }

  // ── DRAFT AUTOSAVE ──────────────────────────────────────────────
  // Saves the current in-progress form every 5 seconds so nothing is lost
  const DRAFT_KEY = 'valusis_draft';

  function saveDraft(uid) {
    try {
      const inp = getInp(uid);
      if (!inp.tiktok && !inp.instagram) return; // nothing to save
      const s = getState(uid);
      const draft = {
        uid, inp,
        rateType: s.rateType,
        selectedRate: s.selectedRate,
        bonuses: s.bonuses,
        eligibleTt: s.eligibleTt,
        eligibleIg: s.eligibleIg,
        hasJoint: s.hasJoint,
        jointRateType: s.jointRateType,
        jointSelectedRate: s.jointSelectedRate,
        jointBonuses: s.jointBonuses,
        jointEligibleTt: s.jointEligibleTt,
        jointEligibleIg: s.jointEligibleIg,
        // Raw field values for joint (getJointInp reads DOM)
        jointFields: s.hasJoint ? (() => {
          const g = id => document.getElementById(`${id}-${uid}`)?.value || '';
          const gn = id => parseFloat(g(id)) || 0;
          return {
            tiktok: g('jtt'), youtube: g('jyt'),
            over: gn('jover'), s7Over: gn('js7over'),
            under: gn('junder'), s7Under: gn('js7under'),
            igViews: gn('jigv'), s7Ig: gn('js7ig'),
            ytViews: gn('jytv'), s7Yt: gn('js7yt'),
      capS7Vids: 0, // joint cap S7 not separately tracked yet
            missedTt: gn('jmisstt'), missedIg: gn('jmissig'),
            tier1: gn('jtier1'),
            vcap: g('jvcap'), vcapvids: g('jvcapvids'),
            cpm: g('jcpm'), ret: g('jret'),
          };
        })() : null,
        // Raw cap fields
        vcap: document.getElementById(`vcap-${uid}`)?.value || '',
        vcapvids: document.getElementById(`vcapvids-${uid}`)?.value || '',
        vcaps7: document.getElementById(`vcaps7-${uid}`)?.value || '',
        notes: document.getElementById(`notes-${uid}`)?.value || '',
        savedAt: new Date().toISOString(),
      };
      storage().setItem(DRAFT_KEY, JSON.stringify(draft));
    } catch(e) {}
  }

  function clearDraft() {
    try { storage().removeItem(DRAFT_KEY); } catch(e) {}
  }

  function loadDraft() {
    try { return JSON.parse(storage().getItem(DRAFT_KEY)); } catch(e) { return null; }
  }

  function restoreDraft() {
    const draft = loadDraft();
    if (!draft || !draft.inp?.tiktok) return;
    // Check if it's from today (don't restore stale drafts older than 24h)
    const age = Date.now() - new Date(draft.savedAt).getTime();
    if (age > 86400000) { clearDraft(); return; }

    const uid = Date.now().toString();
    const wrapper = document.getElementById('formWrapper');
    renderForm(uid, wrapper);

    setTimeout(() => {
      const g = id => document.getElementById(`${id}-${uid}`);
      const s = getState(uid);

      // Restore handles
      if (g('tt')) g('tt').value = draft.inp.tiktok || '';
      if (g('ig')) g('ig').value = draft.inp.instagram || '';

      // Restore rate
      s.rateType = draft.rateType || 'standard';
      setType(uid, s.rateType);
      if (draft.selectedRate) {
        s.selectedRate = draft.selectedRate;
        document.querySelectorAll(`[data-uid="${uid}"].rate-btn:not([data-joint])`).forEach(b => b.classList.remove('active'));
        const customBtn = [...document.querySelectorAll(`[data-uid="${uid}"].rate-btn:not([data-joint])`)].find(b => !b.dataset.cpm);
        if (customBtn) customBtn.classList.add('active');
        const customDiv = document.getElementById(`custom-${uid}`);
        if (customDiv) customDiv.classList.add('open');
        if (g('cpm')) g('cpm').value = draft.selectedRate.cpm || '';
        if (g('ret')) g('ret').value = draft.selectedRate.retainer || '';
      }

      // Restore cap
      if (g('vcap'))    g('vcap').value    = draft.vcap    || '';
      if (g('vcapvids'))g('vcapvids').value= draft.vcapvids|| '';
      if (g('vcaps7'))  g('vcaps7').value  = draft.vcaps7  || '';

      // Restore views
      if (g('over'))    g('over').value    = draft.inp.over    || '';
      if (g('s7over'))  g('s7over').value  = draft.inp.s7Over  || '';
      if (g('under'))   g('under').value   = draft.inp.under   || '';
      if (g('s7under')) g('s7under').value = draft.inp.s7Under || '';
      if (g('igv'))     g('igv').value     = draft.inp.igViews || '';
      if (g('s7ig'))    g('s7ig').value    = draft.inp.s7Ig    || '';

      // Restore performance
      if (g('tier1'))  g('tier1').value  = draft.inp.tier1    || '';
      if (g('misstt')) g('misstt').value = draft.inp.missedTt || '';
      if (g('missig')) g('missig').value = draft.inp.missedIg || '';

      // Restore eligibility
      s.eligibleTt = false; s.eligibleIg = false;
      if (draft.eligibleTt) toggleEligible(uid, 'tt');
      if (draft.eligibleIg) toggleEligible(uid, 'ig');

      // Restore bonuses
      s.bonuses = (draft.bonuses || []).map(b => ({...b}));
      renderBonuses(uid);

      // Restore notes
      if (g('notes')) g('notes').value = draft.notes || '';

      // Restore joint
      if (draft.hasJoint && draft.jointFields) {
        toggleJoint(uid);
        setTimeout(() => {
          const jg = id => document.getElementById(`${id}-${uid}`);
          const jf = draft.jointFields;
          if (jg('jtt'))      jg('jtt').value      = jf.tiktok  || '';
          if (jg('jyt'))      jg('jyt').value      = jf.youtube || '';
          if (jg('jcpm'))     jg('jcpm').value     = jf.cpm     || '';
          if (jg('jret'))     jg('jret').value     = jf.ret     || '';
          if (jg('jvcap'))    jg('jvcap').value    = jf.vcap    || '';
          if (jg('jvcapvids'))jg('jvcapvids').value= jf.vcapvids|| '';
          if (jg('jover'))    jg('jover').value    = jf.over    || '';
          if (jg('js7over'))  jg('js7over').value  = jf.s7Over  || '';
          if (jg('junder'))   jg('junder').value   = jf.under   || '';
          if (jg('js7under')) jg('js7under').value = jf.s7Under || '';
          if (jg('jigv'))     jg('jigv').value     = jf.igViews || '';
          if (jg('js7ig'))    jg('js7ig').value    = jf.s7Ig    || '';
          if (jg('jytv'))     jg('jytv').value     = jf.ytViews || '';
          if (jg('js7yt'))    jg('js7yt').value    = jf.s7Yt    || '';
          if (jg('jmisstt'))  jg('jmisstt').value  = jf.missedTt|| '';
          if (jg('jmissig'))  jg('jmissig').value  = jf.missedIg|| '';
          if (jg('jtier1'))   jg('jtier1').value   = jf.tier1   || '';
          s.jointRateType = draft.jointRateType || 'standard';
          setTypeJ(uid, s.jointRateType);
          if (draft.jointSelectedRate) {
            s.jointSelectedRate = draft.jointSelectedRate;
            document.querySelectorAll(`[data-uid="${uid}"][data-joint="1"].rate-btn`).forEach(b => b.classList.remove('active'));
            const jcb = [...document.querySelectorAll(`[data-uid="${uid}"][data-joint="1"].rate-btn`)].find(b => !b.dataset.cpm);
            if (jcb) jcb.classList.add('active');
            const jcd = document.getElementById(`jCustom-${uid}`);
            if (jcd) jcd.classList.add('open');
          }
          s.jointBonuses = (draft.jointBonuses || []).map(b => ({...b}));
          renderJointBonuses(uid);
          updatePreview(uid);
        }, 50);
      }

      updatePreview(uid);

      // Show a small indicator that draft was restored
      const ind = document.createElement('div');

  const DISCORD = { cpm: 0.5, retainer: 100, ig: 0, cap: 500 };
  const formState = {};

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return '0';
    return Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  function fmtDec(n, d=2) {

  // ─── CALCULATION ────────────────────────────────────────────────
  // Views are entered in thousands.
  // Normal views: counted at full CPM
  // Style 7 views: counted at half CPM (0.5x)
  // Style 7 views are a SUBSET of the total views (not added on top)
  // So: totalViews = over + under (both already include style7 inside them)
  // normalViews = over + under - s7Over - s7Under
  // s7Views = s7Over + s7Under
  // viewPay = (normalViews * cpm) + (s7Views * cpm * 0.5)

  function calcPay(inp, rate) {
    const cpm   = rate.cpm;
    const s7Cpm = cpm / 2; // Style 7 is always half CPM regardless of rate

    // ── TIKTOK VIEWS ─────────────────────────────────────────────
    // Normal views (over/under 50k) and Style 7 views are SEPARATE inputs.
    // e.g. 25k normal + 66k Style 7 = 91k total, paid as (25k × cpm) + (66k × s7Cpm)
    const overK    = inp.over;   // normal views over 50k
    const s7OverK  = inp.s7Over; // separate Style 7 views (over 50k category)
    const underK   = inp.under;  // normal views under 50k
    const s7UnderK = inp.s7Under;// separate Style 7 views (under 50k category)

    const ttNormalK = overK + underK;
    const ttS7K     = s7OverK + s7UnderK;
    const ttRegularK = ttNormalK + ttS7K; // all non-capped TT views

    // Capped videos: each counts as capK views at full CPM (not Style 7)
    const capK         = rate.cap || 1000;
    const capVids      = rate.capVids || 0;
    const capS7Vids    = inp.capS7Vids || 0;                       // capped videos in Style 7
    const capRegVids   = Math.max(0, capVids - capS7Vids);         // capped videos at full CPM
    const capS7ViewsK  = capS7Vids  * capK;                        // views from Style 7 capped
    const capRegViewsK = capRegVids  * capK;                        // views from regular capped
    const cappedViewsK = capVids * capK;                            // total capped views

    const tiktokPay = (ttNormalK * cpm) + (ttS7K * s7Cpm) + (capRegViewsK * cpm) + (capS7ViewsK * s7Cpm);
    const ttTotalK  = ttRegularK + cappedViewsK;

    // ── IG VIEWS ─────────────────────────────────────────────────
    const igNormalK = inp.igViews;
    const igS7K     = inp.s7Ig;
    const igTotalK  = igNormalK + igS7K;
    const igPay     = (igNormalK * cpm) + (igS7K * s7Cpm);

    // ── YOUTUBE VIEWS ─────────────────────────────────────────────
    const ytNormalK = inp.ytViews;
    const ytS7K     = inp.s7Yt;
    const ytTotalK  = ytNormalK + ytS7K;
    const ytPay     = (ytNormalK * cpm) + (ytS7K * s7Cpm);

    // ── TOTALS ───────────────────────────────────────────────────
    const viewPay      = tiktokPay + igPay + ytPay;
    const subtotal     = viewPay;
    const ttRetainer   = inp.eligibleTt ? rate.retainer : 0;
    const igRetainer   = inp.eligibleIg ? 50 : 0;
    const bonusTotal   = inp.bonuses.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);
    const withRetainer = subtotal + ttRetainer;
    const total        = withRetainer + bonusTotal + igRetainer;

    return {
      overK, s7OverK, underK, s7UnderK, ttNormalK, ttS7K,
      cappedViewsK, capVids, capK, ttTotalK,
      totalViewsK: ttTotalK,
      tiktokPay, igNormalK, igS7K, igTotalK, igPay,
      ytNormalK, ytS7K, ytTotalK, ytPay,
      viewPay, s7Cpm, subtotal, ttRetainer, withRetainer,
      bonusTotal, igRetainer, bonuses: inp.bonuses, total,
      rate, capped: capVids > 0
    };
  }

  function buildText(inp, c, rateLabel, rateType, jointInp, jointCalc, jointRateLabel, jointRateType) {
    const SEP = '─────────────────────────';
    const L   = [];

    function pushAccount(aInp, aC, aRateLabel) {
      const att = aInp.tiktok || '[tiktok]';
      const aig = aInp.instagram || inp.instagram || '[instagram]';
      L.push(`${att}  (${aig})`);
      L.push(`Deal: ${aRateLabel}`);
      L.push(SEP);
      L.push('TIKTOK');
      L.push(`  Over 50k:   ${fmt(aInp.over)}k${aInp.s7Over  ? `   |  Style 7: ${fmt(aInp.s7Over)}k`  : ''}`);
      L.push(`  Under 50k:  ${fmt(aInp.under)}k${aInp.s7Under ? `   |  Style 7: ${fmt(aInp.s7Under)}k` : ''}`);
      if (aC.capped) L.push(`  Capped:     ${aC.capVids}x ${fmt(aC.capK)}k${aInp.capS7Vids ? `   |  Style 7: ${aInp.capS7Vids}x` : ''}`);
      L.push(`  Subtotal:   $${fmt(aC.tiktokPay)}`);
      if (aInp.igViews || aInp.s7Ig) {
        L.push('INSTAGRAM');
        L.push(`  Views:      ${fmt(aInp.igViews)}k${aInp.s7Ig ? `   |  Style 7: ${fmt(aInp.s7Ig)}k` : ''}`);
        L.push(`  Subtotal:   $${fmt(aC.igPay)}`);
      }
      if (aInp.ytViews || aInp.s7Yt) {
        L.push('YOUTUBE');
        L.push(`  Views:      ${fmt(aInp.ytViews)}k${aInp.s7Yt ? `   |  Style 7: ${fmt(aInp.s7Yt)}k` : ''}`);
        L.push(`  Subtotal:   $${fmt(aC.ytPay)}`);
      }
      const mTt = aInp.missedTt ? `${aInp.missedTt} day${aInp.missedTt>1?'s':''} on TikTok` : null;
      const mIg = aInp.missedIg ? `${aInp.missedIg} day${aInp.missedIg>1?'s':''} on Instagram` : null;
      const mStr = [mTt, mIg].filter(Boolean).join(', ');
      L.push('PERFORMANCE');
      L.push(`  Frequency:  ${mStr ? 'Missed ' + mStr : 'No missed days'}`);
      if (aInp.tier1) L.push(`  Tier 1:     ${aInp.tier1}%`);
      L.push(SEP);
      L.push(`Views pay:        $${fmt(aC.subtotal)}`);
      if (aC.ttRetainer > 0) L.push(`TikTok retainer:  +$${fmt(aC.ttRetainer)}`);
      if (aC.igRetainer > 0) L.push(`IG retainer:      +$${fmt(aC.igRetainer)}`);
      (aC.bonuses || []).filter(b => parseFloat(b.amount) > 0).forEach(b => {
        L.push(`Bonus:            +$${fmt(parseFloat(b.amount))}${b.reason ? `  (${b.reason})` : ''}`);
      });
      L.push(SEP);
      L.push(`TOTAL DUE:        $${fmt(aC.total)}`);
    }

    pushAccount(inp, c, rateLabel);

    if (jointInp && jointCalc) {
      pushAccount(jointInp, jointCalc, jointRateLabel);
      L.push('═════════════════════════');
      L.push(`COMBINED TOTAL:   $${fmt(c.total + jointCalc.total)}`);
      L.push('═════════════════════════');
    }

    if (inp.notes) L.push(`Notes: ${inp.notes}`);

    return L.join('\n');
  }

  // Builds a lookup of all saved handles → their rate/cap settings
  function buildRateMemory() {
    const mem = {}; // handle (lowercase) → entry snapshot
    entries.forEach(e => {
      const handles = [e.inp.tiktok, e.inp.instagram, e.inp.youtube].filter(Boolean);

    const promptId = isJoint ? `ratePromptJ-${uid}` : `ratePrompt-${uid}`;
    const promptTextId = isJoint ? `ratePromptTextJ-${uid}` : `ratePromptText-${uid}`;

    if (!val || val.length < 2) {
      isJoint ? dismissPromptJ(uid) : dismissPrompt(uid);
      return;
    }

    const mem = buildRateMemory();
    const match = mem[val];
    if (match) {
      const prompt = document.getElementById(promptId);
      const text   = document.getElementById(promptTextId);
      if (prompt && text) {
        text.textContent = `"${match.inp.tiktok || match.inp.instagram || match.inp.youtube}" found — use same deal (${match.text.split('\n')[2]?.replace('Deal: ','') || 'same rates'})?`;
        prompt.style.display = 'flex';
        prompt.dataset.matchKey = val;
        prompt.dataset.isJoint = isJoint ? '1' : '0';
      }
    } else {
      isJoint ? dismissPromptJ(uid) : dismissPrompt(uid);
    }
  };

  window.dismissPrompt = (uid) => {
    const p = document.getElementById(`ratePrompt-${uid}`);
    if (p) p.style.display = 'none';
  };

  window.applyMemoryRate = (uid, isJoint = false) => {
    const promptId = isJoint ? `ratePromptJ-${uid}` : `ratePrompt-${uid}`;
    const p = document.getElementById(promptId);
    if (!p) return;
    const key = p.dataset.matchKey;
    const match = buildRateMemory()[key];
    if (!match) return;
    const s = getState(uid);

    if (!isJoint) {
      // Fill main handles
      const ttEl = document.getElementById(`tt-${uid}`);
      const igEl = document.getElementById(`ig-${uid}`);
      const ytEl = document.getElementById(`yt-${uid}`);
      if (ttEl && match.inp.tiktok)    ttEl.value = match.inp.tiktok;
      if (igEl && match.inp.instagram) igEl.value = match.inp.instagram;
      if (ytEl && match.inp.youtube)   ytEl.value = match.inp.youtube;
      s.rateType = match.rateType || 'standard';
      setType(uid, s.rateType);
      if (match.calc?.rate) {
        s.selectedRate = { cpm: match.calc.rate.cpm, retainer: match.calc.rate.retainer, ig: 0 };
        const customDiv = document.getElementById(`custom-${uid}`);
        if (customDiv) customDiv.style.display = 'flex';
        const cpmEl = document.getElementById(`cpm-${uid}`);
        const retEl = document.getElementById(`ret-${uid}`);
        if (cpmEl) cpmEl.value = match.calc.rate.cpm;
        if (retEl) retEl.value = match.calc.rate.retainer;
        document.querySelectorAll(`[data-uid="${uid}"].rate-btn:not([data-joint])`).forEach(b => b.classList.remove('active'));
        const customBtn = [...document.querySelectorAll(`[data-uid="${uid}"].rate-btn:not([data-joint])`)].find(b => !b.dataset.cpm);
        if (customBtn) customBtn.classList.add('active');
      }
      const capEl = document.getElementById(`vcap-${uid}`);
      if (capEl && match.calc?.rate?.cap && match.calc.rate.cap !== 1000) capEl.value = match.calc.rate.cap;
      dismissPrompt(uid);
    } else {
      // Fill joint handles (TikTok + YouTube only, IG is shared)
      const jttEl = document.getElementById(`jtt-${uid}`);
      const jytEl = document.getElementById(`jyt-${uid}`);
      if (jttEl && match.inp.tiktok)  jttEl.value = match.inp.tiktok;
      if (jytEl && match.inp.youtube) jytEl.value = match.inp.youtube;
      s.jointRateType = match.rateType || 'standard';
      setTypeJ(uid, s.jointRateType);
      if (match.calc?.rate) {
        s.jointSelectedRate = { cpm: match.calc.rate.cpm, retainer: match.calc.rate.retainer, ig: 0 };
        const customDiv = document.getElementById(`jCustom-${uid}`);
        if (customDiv) customDiv.style.display = 'flex';
        const cpmEl = document.getElementById(`jcpm-${uid}`);
        const retEl = document.getElementById(`jret-${uid}`);
        if (cpmEl) cpmEl.value = match.calc.rate.cpm;
        if (retEl) retEl.value = match.calc.rate.retainer;
        document.querySelectorAll(`[data-uid="${uid}"][data-joint="1"].rate-btn`).forEach(b => b.classList.remove('active'));
        const customBtn = [...document.querySelectorAll(`[data-uid="${uid}"][data-joint="1"].rate-btn`)].find(b => !b.dataset.cpm);
        if (customBtn) customBtn.classList.add('active');
      }
      const capEl = document.getElementById(`jvcap-${uid}`);
      if (capEl && match.calc?.rate?.cap && match.calc.rate.cap !== 1000) capEl.value = match.calc.rate.cap;

  window.addEntry = (uid) => {
    const inp = getInp(uid);
    if (!inp.tiktok) return;
    const rate = getRate(uid);
    const calc = calcPay(inp, rate);
    const s = getState(uid);
    const rateLabel = getRateLabel(uid);

    // Joint account
    let jointInp = null, jointCalc = null, jointRateLabel = null;
    if (s.hasJoint) {
      jointInp = getJointInp(uid);
      const jointRate = getJointRate(uid);
      jointCalc = calcPay(jointInp, jointRate);
      // Build joint rate label
      if (s.jointRateType === 'discord') {
        jointRateLabel = `$0.5/1k + $100 · 500k cap`;
      } else if (jointRate.cpm || jointRate.retainer) {
        const capStr = jointRate.cap && jointRate.cap !== 1000 ? ` · ${jointRate.cap}k cap` : '';
        jointRateLabel = `$${jointRate.cpm}/1k + $${jointRate.retainer}${capStr}`;
      } else {
        jointRateLabel = rateLabel;
      }
    }

    const text = buildText(inp, calc, rateLabel, s.rateType, jointInp, jointCalc, jointRateLabel, s.jointRateType);
    const now = new Date();
    const savedAt = now.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
                  + ' ' + now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    entries.push({ inp, calc, text, rateType: s.rateType, jointInp, jointCalc, savedAt });
    saveEntries();
    clearDraft();
    renderEntries();
    cancelForm(uid);
    setTimeout(() => {
      const el = document.getElementById(`entry-${entries.length - 1}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
  };

  window.cancelForm = (uid) => {
    clearDraft();
    document.getElementById(`form-${uid}`)?.closest('div')?.remove();
    delete formState[uid];
  };

  window.toggleEntry = (i) => {
    const body = document.getElementById(`body-${i}`);
    const chev = document.getElementById(`chev-${i}`);
    const open = body.classList.toggle('open');
    if (chev) chev.textContent = open ? '▲' : '▼';
  };

  window.copyEntry = (i) => {
    const text = entries[i].text;
    const btn = document.getElementById(`copy-${i}`);
    const confirm = () => {
      btn.textContent = '✓ Copied'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy Payment'; btn.classList.remove('copied'); }, 2000);
    };
    // Try modern clipboard API first (works on HTTPS / GitHub Pages)
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(confirm).catch(() => fallbackCopy(text, confirm));
    } else {
      fallbackCopy(text, confirm);
    }
  };

  function fallbackCopy(text, callback) {
    // Works on local files and HTTP
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); callback(); } catch(e) { alert('Copy failed — please copy manually.'); }
    document.body.removeChild(ta);
  }

  window.editEntry = (i) => {
    const e = entries[i];
    if (!e) return;
    // Remove existing form if open
    document.getElementById('formWrapper').innerHTML = '';
    Object.keys(formState).forEach(k => delete formState[k]);

    const uid = 'edit_' + Date.now();
    // Create form with existing data
    const wrapper = document.getElementById('formWrapper');
    renderForm(uid, wrapper);

    // Wait for DOM then pre-fill all fields
    setTimeout(() => {
      const g = id => document.getElementById(`${id}-${uid}`);
      const s = getState(uid);

      // Handles
      if (g('tt')) g('tt').value = e.inp.tiktok || '';
      if (g('ig')) g('ig').value = e.inp.instagram || '';

      // Rate type
      s.rateType = e.rateType || 'standard';
      setType(uid, s.rateType);

      // Rate values — always use custom fields
      if (e.calc?.rate) {
        document.querySelectorAll(`[data-uid="${uid}"].rate-btn:not([data-joint])`).forEach(b => b.classList.remove('active'));
        const customBtn = [...document.querySelectorAll(`[data-uid="${uid}"].rate-btn:not([data-joint])`)].find(b => !b.dataset.cpm);
        if (customBtn) customBtn.classList.add('active');
        const customDiv = document.getElementById(`custom-${uid}`);
        if (customDiv) customDiv.classList.add('open');
        if (g('cpm')) g('cpm').value = e.calc.rate.cpm;
        if (g('ret')) g('ret').value = e.calc.rate.retainer;
        s.selectedRate = { cpm: e.calc.rate.cpm, retainer: e.calc.rate.retainer, ig: 0 };
      }

      // Cap
      if (g('vcap') && e.calc?.rate?.cap && e.calc.rate.cap !== 1000) g('vcap').value = e.calc.rate.cap;
      if (g('vcapvids') && e.calc?.capVids) g('vcapvids').value = e.calc.capVids;
      if (g('vcaps7') && e.inp?.capS7Vids) g('vcaps7').value = e.inp.capS7Vids;

      // Views
      if (g('over'))    g('over').value    = e.inp.over    || '';
      if (g('s7over'))  g('s7over').value  = e.inp.s7Over  || '';
      if (g('under'))   g('under').value   = e.inp.under   || '';
      if (g('s7under')) g('s7under').value = e.inp.s7Under || '';
      if (g('igv'))     g('igv').value     = e.inp.igViews || '';
      if (g('s7ig'))    g('s7ig').value    = e.inp.s7Ig    || '';

      // Performance
      if (g('tier1'))  g('tier1').value  = e.inp.tier1    || '';
      if (g('misstt')) g('misstt').value = e.inp.missedTt || '';
      if (g('missig')) g('missig').value = e.inp.missedIg || '';

      // Eligibility
      if (e.inp.eligibleTt) toggleEligible(uid, 'tt');
      if (e.inp.eligibleIg) toggleEligible(uid, 'ig');

      // Bonuses
      s.bonuses = (e.inp.bonuses || []).map(b => ({...b}));
      renderBonuses(uid);

      // Notes
      if (g('notes')) g('notes').value = e.inp.notes || '';

      // Joint account
      if (e.jointInp && e.jointCalc) {
        toggleJoint(uid);
        setTimeout(() => {
          const jg = id => document.getElementById(`${id}-${uid}`);
          if (jg('jtt')) jg('jtt').value = e.jointInp.tiktok || '';
          if (jg('jyt')) jg('jyt').value = e.jointInp.youtube || '';
          const jState = getState(uid);
          jState.jointRateType = e.jointInp.rateType || 'standard';
          setTypeJ(uid, jState.jointRateType);
          if (e.jointCalc?.rate) {
            document.querySelectorAll(`[data-uid="${uid}"][data-joint="1"].rate-btn`).forEach(b => b.classList.remove('active'));
            const jCustomBtn = [...document.querySelectorAll(`[data-uid="${uid}"][data-joint="1"].rate-btn`)].find(b => !b.dataset.cpm);
            if (jCustomBtn) jCustomBtn.classList.add('active');
            const jCustomDiv = document.getElementById(`jCustom-${uid}`);
            if (jCustomDiv) jCustomDiv.classList.add('open');
            if (jg('jcpm')) jg('jcpm').value = e.jointCalc.rate.cpm;
            if (jg('jret')) jg('jret').value = e.jointCalc.rate.retainer;
          }
          if (jg('jover'))    jg('jover').value    = e.jointInp.over    || '';
          if (jg('js7over'))  jg('js7over').value  = e.jointInp.s7Over  || '';
          if (jg('junder'))   jg('junder').value   = e.jointInp.under   || '';
          if (jg('js7under')) jg('js7under').value = e.jointInp.s7Under || '';
          if (jg('jigv'))     jg('jigv').value     = e.jointInp.igViews || '';
          if (jg('js7ig'))    jg('js7ig').value    = e.jointInp.s7Ig    || '';
          if (jg('jytv'))     jg('jytv').value     = e.jointInp.ytViews || '';
          if (jg('js7yt'))    jg('js7yt').value    = e.jointInp.s7Yt    || '';
          if (jg('jmisstt'))  jg('jmisstt').value  = e.jointInp.missedTt || '';
          if (jg('jmissig'))  jg('jmissig').value  = e.jointInp.missedIg || '';
          if (jg('jtier1'))   jg('jtier1').value   = e.jointInp.tier1   || '';
          jState.jointBonuses = (e.jointInp.bonuses || []).map(b => ({...b}));
          renderJointBonuses(uid);
        }, 50);
      }

      // Override Add Entry to update instead of create
      const addBtn = document.getElementById(`addBtn-${uid}`);
      if (addBtn) {
        addBtn.textContent = 'Update Entry';
        addBtn.onclick = () => {
          // Re-run same logic as addEntry but replace at index i
          const newInp = getInp(uid);
          if (!newInp.tiktok) return;
          const newRate = getRate(uid);
          const newCalc = calcPay(newInp, newRate);
          const newS = getState(uid);
          const newRateLabel = getRateLabel(uid);
          let newJointInp = null, newJointCalc = null, newJointRateLabel = null;
          if (newS.hasJoint) {
            newJointInp = getJointInp(uid);
            const jr = getJointRate(uid);
            newJointCalc = calcPay(newJointInp, jr);
            newJointRateLabel = newS.jointRateType === 'discord'
              ? '$0.5/1k + $100 · 500k cap'
              : `$${jr.cpm}/1k + $${jr.retainer}${jr.cap !== 1000 ? ` · ${jr.cap}k cap` : ''}`;
          }
          const newText = buildText(newInp, newCalc, newRateLabel, newS.rateType, newJointInp, newJointCalc, newJointRateLabel, newS.jointRateType);
          entries[i] = { inp: newInp, calc: newCalc, text: newText, rateType: newS.rateType, jointInp: newJointInp, jointCalc: newJointCalc, savedAt: entries[i].savedAt + ' (edited)' };
          saveEntries();
          renderEntries();
          cancelForm(uid);
        };
      }

      updatePreview(uid);
      document.getElementById(`form-${uid}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
  };

  window.removeEntry = (i) => {
    // confirm() is blocked in iframes (Notion embeds) — use inline confirmation instead
    const btn = document.getElementById(`remove-${i}`);
    if (!btn) return;
    if (btn.dataset.confirming === 'true') {
      entries.splice(i, 1);
      saveEntries();
      renderEntries();
    } else {
      btn.dataset.confirming = 'true';
      btn.textContent = 'Sure?';
      btn.style.color = '#ff6b6b';
      btn.style.borderColor = '#ff6b6b55';
      setTimeout(() => {
        if (btn.dataset.confirming === 'true') {
          btn.dataset.confirming = 'false';
          btn.textContent = 'Remove';
          btn.style.color = '';
          btn.style.borderColor = '';
        }
      }, 2500);
    }
  };

  function renderEntries() {
    entries = getEntries(); // always sync from active sheet
    const list = document.getElementById('entryList');
    list.innerHTML = '';
    document.getElementById('emptyState').style.display = entries.length === 0 ? 'block' : 'none';

    entries.forEach((e, i) => {
      const div = document.createElement('div');
      div.className = 'entry'; div.id = `entry-${i}`;
      const bonusBadge = e.calc.bonusTotal > 0
        ? `<div class="entry-bonus-badge">+$${fmt(e.calc.bonusTotal)} bonus</div>` : '';
      const igBadge = e.calc.igRetainer > 0
        ? `<div class="entry-bonus-badge" style="color:#7b8aff">+$50 IG retainer</div>` : '';
      div.innerHTML = `
        <div class="entry-header" onclick="toggleEntry(${i})">
          <div class="entry-left">
            <span class="entry-num">${String(i+1).padStart(2,'0')}</span>
            <div>
              <div class="entry-name">@${e.inp.tiktok}${e.inp.instagram ? ` / @${e.inp.instagram}` : ''}</div>
              <div class="entry-meta">${fmt(e.calc.ttTotalK)}k TT${e.calc.igTotalK ? ` · ${fmt(e.calc.igTotalK)}k IG` : ''}${e.calc.ytTotalK ? ` · ${fmt(e.calc.ytTotalK)}k YT` : ''} · $${fmtDec(e.calc.rate.cpm)}/1k</div>
              <div class="entry-date">${e.savedAt || ''}</div>
            </div>
          </div>
          <div class="entry-right">
            <div>
              <div class="entry-total">$${fmt(e.calc.total + (e.jointCalc ? e.jointCalc.total : 0))}</div>
              ${bonusBadge}${igBadge}
              <span class="entry-tag ${e.rateType}">${e.rateType === 'discord' ? 'DISCORD' : 'STANDARD'}</span>
            </div>
            <span class="entry-chevron" id="chev-${i}">▼</span>
          </div>
        </div>
        <div class="entry-body" id="body-${i}">
          <div class="breakdown-text">${e.text}</div>
          <div class="entry-actions">
            <button class="btn-copy" id="copy-${i}" onclick="copyEntry(${i})">Copy Payment</button>
            <button class="btn-edit" onclick="editEntry(${i})">Edit</button>
            <button class="btn-remove" id="remove-${i}" onclick="removeEntry(${i})">Remove</button>
          </div>
        </div>`;
      list.appendChild(div);
    });

    const total = entries.reduce((s, e) => s + e.calc.total + (e.jointCalc ? e.jointCalc.total : 0), 0);
    const ct = document.getElementById('cycleTotal');
    ct.textContent = `$${fmt(total)}`;
    ct.classList.toggle('active', entries.length > 0);
    const summary = document.getElementById('summary');
    if (entries.length > 0) {
      summary.style.display = 'flex';
      document.getElementById('summaryLabel').textContent = `${entries.length} influencer${entries.length !== 1 ? 's' : ''} · ${sheets[activeSheetId]?.name || ''}`;
      document.getElementById('summaryValue').textContent = `$${fmt(total)}`;
    } else {
      summary.style.display = 'none';
    }
  }

  // Create button
  function renderForm(uid, wrapper) {
    const div = document.createElement('div');
    div.id = `formContainer-${uid}`;
    div.innerHTML = buildFormHTML(uid);
    wrapper.appendChild(div);

    // Wire rate preset buttons (main and joint)
    div.querySelectorAll(`.rate-btn[data-uid="${uid}"]`).forEach(btn => {
      btn.addEventListener('click', () => {
        const isJoint = btn.dataset.joint === '1';
        const selector = isJoint ? `.rate-btn[data-uid="${uid}"][data-joint="1"]` : `.rate-btn[data-uid="${uid}"]:not([data-joint])`;
        div.querySelectorAll(selector).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const s = getState(uid);
        if (isJoint) {
          if (btn.dataset.cpm === '') {
            document.getElementById(`jCustom-${uid}`)?.classList.add('open');
          } else {
            document.getElementById(`jCustom-${uid}`)?.classList.remove('open');
            s.jointSelectedRate = { cpm: parseFloat(btn.dataset.cpm), retainer: parseFloat(btn.dataset.ret), ig: 0 };
          }
        } else {
          if (btn.dataset.cpm === '') {
            s.isCustom = true;
            document.getElementById(`custom-${uid}`).classList.add('open');
          } else {
            s.isCustom = false;
            document.getElementById(`custom-${uid}`).classList.remove('open');
            s.selectedRate = { cpm: parseFloat(btn.dataset.cpm), retainer: parseFloat(btn.dataset.ret), ig: parseFloat(btn.dataset.ig) };
          }
        }
        updatePreview(uid);
      });
    });

    setTimeout(() => {
      document.getElementById(`form-${uid}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 30);
  }

  document.getElementById('btnCreate').addEventListener('click', () => {
    const uid = Date.now().toString();
    const wrapper = document.getElementById('formWrapper');
    renderForm(uid, wrapper);
  });

  renderSheets();
  renderEntries();
  restoreDraft();
</script>
</body>
</html>
